[project]
name = "learning-rag"
version = "0.1.0"
description = "A tutorial build of a multi-format RAG chatbot (Gemini, free tier) — see rag-learning-material.md"
readme = "README.md"
requires-python = ">=3.11"

# Core: everything needed for Day 1's vertical slice.
# Heavy optional deps live in the groups below so the first `uv sync` stays fast.
dependencies = [
    "google-genai>=1.0.0",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1.2",
    "rank-bm25>=0.2.2",
    "numpy>=2.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "httpx>=0.28",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
# Session 6 — local cross-encoder reranker. ~2GB with torch.
rerank = [
    "sentence-transformers>=3.3",
]
# Session 9 — real vector DB with native sparse+dense hybrid.
qdrant = [
    "qdrant-client>=1.12",
]
# Experiments — the charts that become interview evidence.
charts = [
    "matplotlib>=3.9",
]
# Session 11 — the UI.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
]
# Session 12 stretch — the LangChain port.
langchain = [
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-community>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragkit"]
