# Gates that run on every push and pull request, on both branches.
#
# Deploy lives in deploy.yml and depends on this passing. Split because a PR from
# a fork must be able to run the GATES without touching AWS credentials — the OIDC
# trust deliberately excludes fork PRs, so a combined workflow would fail at the
# credential step and report a red X that says nothing about the code.
name: ci

on:
  push:
    branches: [main, product]
  pull_request:
    branches: [main, product]

# A second push while the first is still testing makes the first result
# irrelevant. Cancel it rather than paying for an answer nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: sync deps
        run: uv sync --frozen --extra web

      # ONE DEFINITION OF THE GATES. The three checks used to be listed inline
      # here, and a local runner was added because Actions is billing-locked on
      # this account -- which immediately created two lists of gates that would
      # drift, each claiming to say whether the code is good. That is the
      # survey-script failure: two programs, one question, different answers.
      #
      # The list now lives in scripts/ci_local.py and this calls it. A gate added
      # there is added here, because there is only one.
      - name: gates (same list scripts/ci_local.py runs)
        env:
          PYTHONIOENCODING: utf-8
        run: uv run python scripts/ci_local.py

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
        working-directory: app/web
      # `npm run build` is `tsc -b && vite build`. NOT `tsc --noEmit`, which exits
      # 0 on code this rejects — that is how a type error reached a deployment
      # once already.
      - run: npm run build
        working-directory: app/web

  image:
    name: image builds and boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ragkit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # BOOT IT, do not just build it. Three deploy-breaking defects in this
      # project built cleanly and failed at container start: fastapi missing from
      # the default extra, a missing `pathlib` import in the static mount, and
      # hatchling failing on an absent README. A build that is never run is a
      # syntax check.
      #
      # No GEMINI_API_KEY here on purpose: /api/health must answer without one, so
      # a health check cannot depend on a paid service being reachable.
      - name: boot at nano limits and answer /api/health
        run: |
          docker run -d --name ci --cpus 0.25 --memory 512m -p 8000:8000 ragkit:ci
          # THREE MINUTES, not ninety seconds, and the reason is CPU contention.
          #
          # Boot is ~22-28s on an idle host: importing PyMuPDF, warming tiktoken
          # and loading the index, all inside a 0.25 vCPU cap. But the build step
          # runs immediately before this one in the SAME job, so the runner is
          # still busy — and a 90s window failed locally under exactly that
          # condition while the container was healthy 30s later. A timeout tuned
          # on an idle machine becomes a flaky gate on a loaded one, and a gate
          # that fails at random gets muted.
          #
          # Progress is printed so a real hang is distinguishable from a slow
          # start in the log, rather than both looking like silence.
          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health || true)
            if [ "$code" = "200" ]; then echo "healthy after $((i*3))s"; ok=1; break; fi
            [ $((i % 5)) -eq 0 ] && echo "  ...${code:-no-response} at $((i*3))s"
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "never became healthy; container logs follow"
            docker logs ci
            exit 1
          fi
          curl -fsS http://127.0.0.1:8000/api/health > /dev/null
          echo "--- the read-only guard must hold in the image ---"
          for path in /api/ingest /api/documents; do
            got=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:8000$path")
            echo "  POST $path -> $got"
            [ "$got" = "403" ] || { echo "GUARD OPEN in the image"; exit 1; }
          done
          got=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://127.0.0.1:8000/api/documents/x)
          echo "  DELETE /api/documents/x -> $got"
          [ "$got" = "403" ] || { echo "GUARD OPEN in the image"; exit 1; }
          echo "--- memory at nano limits ---"
          docker stats ci --no-stream --format '  {{.MemUsage}} ({{.MemPerc}})'
      - name: container logs on failure
        if: failure()
        run: docker logs ci

  retrieval-regression:
    name: retrieval regression gate
    runs-on: ubuntu-latest
    # Needs a key: the eval embeds each question. The generation tier is
    # deliberately NOT gated — see the generation_tier_ci_gating deferral. One run
    # is n=1, and an unchanged index has already moved abstentions 17->18 between
    # runs, so a generation gate would fail builds for no reason and get muted.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra web

      - name: retrieval eval vs stored baseline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
          # Bounded so a runaway loop cannot spend real money from CI. The whole
          # eval embeds ~92 short questions; this is far above that and far below
          # anything alarming.
          RAGKIT_MAX_OPERATION_TOKENS: '200000'
          RAGKIT_DAILY_TOKEN_CAP: '400000'
          RAGKIT_DEPLOYMENT_KIND: internal
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "no GEMINI_API_KEY secret set -- skipping the retrieval gate."
            echo "This is a REPORTED skip, not a silent pass: the gate is off until"
            echo "the secret exists, and this line is the record of that."
            exit 0
          fi
          # `--gate` is what makes this a gate: exit 1 on an NDCG@5 regression
          # beyond config.CI_NDCG_REGRESSION_TOLERANCE against the stored baseline.
          #
          # This line previously read `--suite data/eval/golden.jsonl`, copied from
          # the project plan. That flag does not exist -- argparse exits 2 with a
          # usage error. So the gate would have failed on EVERY run, for a reason
          # having nothing to do with the code, and the likely fix from whoever
          # met it at 6pm is deleting the gate.
          #
          # A command in a document is a claim. This one was written, reviewed and
          # copied into CI without once being run.
          #
          # --no-sweep because the seven-budget curve is for analysis, not for a
          # pass/fail decision, and it multiplies the API calls by seven.
          uv run python -m ragkit.eval.run --gate --no-sweep
